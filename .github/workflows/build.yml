name: Build & Release (Desktop)

on:
  push:
    branches: [main, master]
    tags:
      # 桌面版发布标签（历史 v* 语义已冻结，见 README「发布与签名」）
      - 'desktop-v*'
  pull_request:
  workflow_dispatch:

# 默认只读；需要发布的分支在同一 workflow 内按 job 提升权限（最小权限原则）
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test, lint & version check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version consistency
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            node scripts/check-version.mjs --expect-prefix desktop-v
          else
            node scripts/check-version.mjs
          fi

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

  build:
    name: Package ${{ matrix.os }}
    needs: test
    # 只有发布标签 / 手动触发才打包；push main 与 PR 只跑上面的质量门
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v')
    permissions:
      # electron-builder 在推送标签时自动发布到 GitHub Releases
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: macos
          - os: windows-latest
            script: dist:win
            artifact: windows
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          # 未配置签名证书时跳过签名；README「已知限制」已声明产物未签名/未公证
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 推 desktop-v* 标签时 electron-builder 自动发布到 GitHub Releases
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SHA-256 checksums
        shell: bash
        run: node scripts/sha256sums.mjs dist --output "dist/SHA256SUMS-${{ matrix.artifact }}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  publish-checksums:
    name: Publish checksums & release notes
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge checksums
        run: node scripts/merge-sha256sums.mjs artifacts checksums/SHA256SUMS.txt

      - name: Generate release notes from CHANGELOG
        run: node scripts/release-notes.mjs --output release-notes.md

      - name: Upload SHA256SUMS & release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" checksums/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" checksums/SHA256SUMS.txt \
              --title "扫雷 ${TAG#desktop-v}" \
              --notes-file release-notes.md
          fi

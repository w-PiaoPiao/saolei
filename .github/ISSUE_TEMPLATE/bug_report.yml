name: Bug report
description: 报告可复现的缺陷
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供可复现步骤与版本信息。安全问题请勿公开提交，见 SECURITY 说明（如有）。
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - 桌面版（macOS）
        - 桌面版（Windows）
        - 桌面版（Linux）
        - 安卓版（KPA 掌机）
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 应用内「关于」页或 VERSION/package.json 中的版本号
      placeholder: '1.3.0'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 出现…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 截图 / 日志 / 其他信息
      description: 可粘贴截图、控制台日志或棋盘参数（难度、行列、雷数、是否无猜）
    validations:
      required: false

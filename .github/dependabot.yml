version: 2
updates:
  # npm 依赖（Electron/electron-builder/eslint/prettier）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - '@eslint/*'

  # Gradle 依赖（Android）
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

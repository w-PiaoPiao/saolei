name: Feature request
description: 提出新功能或改进建议
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / 使用场景
      description: 请描述痛点，而不只是功能名
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: 期望覆盖的平台
      options:
        - 桌面版
        - 安卓版
        - 双端都希望有
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案 / 其他扫雷产品的做法
    validations:
      required: false

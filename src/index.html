<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>扫雷</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="mine-counter" class="led">010</div>
      <button id="face-button" aria-label="新游戏">🙂</button>
      <div id="timer" class="led">000</div>
      <div class="sep"></div>
      <div id="controls">
        <button class="diff-btn active" data-level="beginner">初级</button>
        <button class="diff-btn" data-level="intermediate">中级</button>
        <button class="diff-btn" data-level="expert">高级</button>
      </div>
    </div>
    <div id="noguess-warning" hidden>⚠ 无解保护不可用，本局可能需要猜</div>
    <div id="generating-hint" hidden>正在生成无猜雷局…</div>
    <div id="board" role="grid" aria-label="扫雷棋盘"></div>
    <div id="pause-overlay">
      <div id="pause-text">⏸ 已暂停</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="solver.js"></script>
  <script src="generator.js"></script>
  <script src="game.js"></script>
  <script src="audio.js"></script>
  <script src="stats.js"></script>
  <script src="keybindings.js"></script>
  <script src="movement.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
